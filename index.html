<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #1E1E2F;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            justify-content: center;
        }
    
        h1 {
            color: #F5F5FA;
            font-size: 3.5em;
            font-weight: bold;
            margin: 20px;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);
        }
    
        p {
            color: #F5F5FA;
            font-size: 1.8em;
            margin: 15px;
        }
    
        .board {
            background-color: #252A41;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
        }
    
        .row {
            display: flex;
            justify-content: center;
        }
    
        .box {
            width: 100px;
            height: 100px;
            background-color: #3A405A;
            margin: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3.5em;
            color: #EAEAEA;
            font-weight: bold;
            border-radius: 10px;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s, box-shadow 0.3s;
        }
    
        .box:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
            cursor: pointer;
        }
    
        button {
            background-color: #3A405A;
            color: #EAEAEA;
            font-size: 1.5em;
            font-weight: bold;
            width: 180px;
            height: 50px;
            margin-top : 20px;
            margin-left: 70px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
            transition: background-color 0.3s, box-shadow 0.3s;
        }
    
        button:hover {
            background-color: #50577A;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
        }
    </style>
    
</head>

<body>
    <h1>Tic Tac Toe</h1>
    <p>Current player playing : <span id="current-player">X</span></p>
    <div class="board">
        <div class="row">
            <div class="box" onclick="selectBox(0)">0</div>
            <div class="box" onclick="selectBox(1)">1</div>
            <div class="box" onclick="selectBox(2)">2</div>
        </div>
        <div class="row">
            <div class="box" onclick="selectBox(3)">3</div>
            <div class="box" onclick="selectBox(4)">4</div>
            <div class="box" onclick="selectBox(5)">5</div>
        </div>
        <div class="row">
            <div class="box" onclick="selectBox(6)">6</div>
            <div class="box" onclick="selectBox(7)">7</div>
            <div class="box" onclick="selectBox(8)">8</div>
        </div>
    <button onclick="resetBoard()" id="reset-button">Reset</button>

    </div>

    <script>
        const board = [-1,-1,-1,-1,-1,-1,-1,-1,-1];
        let currentPlayer = 'X';
        function renderBoard() {
            const allboxes = document.querySelectorAll('.box');

            allboxes.forEach((box,i) => {
                if(board[i] === "X"){
                    box.innerHTML = "X";
                }
                else if(board[i] === "O"){
                    box.innerHTML = "O";
                }
                else{
                    box.innerHTML = "";
                }
            })
        }
        renderBoard();
        function selectBox(boxNumber) {

            if(board[boxNumber] === -1){
                board[boxNumber] = currentPlayer;
                renderBoard();
            }
            else{
                alert("Box already selected");
            }
            if(currentPlayer === 'X'){
                currentPlayer = 'O';
            }
            else{
                currentPlayer = 'X';
            }

            const currentPlayerSpan = document.getElementById('current-player');
            currentPlayerSpan.innerHTML = currentPlayer;
            checkWin();
        }
        function resetBoard(){
            board.fill(-1);
            renderBoard();
            currentPlayer = 'X';
            const currentPlayerSpan = document.getElementById('current-player');
            currentPlayerSpan.innerHTML = currentPlayer;
        }
        function isPlayerWin(places, player) {
            if(board[places[0]] === player && board[places[1]] === player && board[places[2]] === player){
                return true;
            }
            return false;
        }
        


        function checkWin(){
            if(isPlayerWin([0,1,2], 'X')){
                alert("Player X wins!");
            }else if(isPlayerWin([3,4,5], 'X')){
                alert("Player X wins!");
            }else if(isPlayerWin([6,7,8], 'X')){
                alert("Player X wins!");
            }else if(isPlayerWin([0,3,6], 'X')){
                alert("Player X wins!");
            }else if(isPlayerWin([1,4,7], 'X')){
                alert("Player X wins!");
            }else if(isPlayerWin([2,5,8], 'X')){
                alert("Player X wins!");
            }else if(isPlayerWin([0,4,8], 'X')){
                alert("Player X wins!");
            }else if(isPlayerWin([2,4,6], 'X')){
                alert("Player X wins!");
            }

            if(isPlayerWin([0,1,2], 'O')){
                alert("Player O wins!");
            }else if(isPlayerWin([3,4,5], 'O')){
                alert("Player O wins!");
            }else if(isPlayerWin([6,7,8], 'O')){
                alert("Player O wins!");
            }else if(isPlayerWin([0,3,6], 'O')){
                alert("Player O wins!");
            }else if(isPlayerWin([1,4,7], 'O')){
                alert("Player O wins!");
            }else if(isPlayerWin([2,5,8], 'O')){
                alert("Player O wins!");
            }else if(isPlayerWin([0,4,8], 'O')){
                alert("Player O wins!");
            }else if(isPlayerWin([2,4,6], 'O')){
                alert("Player O wins!");
            }
        }

    </script>

</body>

</html>
